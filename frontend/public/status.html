<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Meridiana — Estado del sitio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --negro: #0F130E; --verde: #1A2E24; --terracota: #CC754A; --tumbaga: #9A7A3A;
    --marfil: #E7D5BC; --blanco: #F8F4EE;
    --line: rgba(231, 213, 188, 0.14);
    --muted: rgba(231, 213, 188, 0.62);
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--negro); color: var(--marfil); font-family: var(--sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 48px 16px 96px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { font-family: var(--serif); font-size: 26px; font-weight: 400; letter-spacing: .02em; color: var(--blanco); }
  .live { display: inline-flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--terracota); border: 1px solid rgba(204,117,74,.45); padding: 7px 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--terracota); position: relative; }
  .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--terracota); animation: pulse 1.8s ease-out infinite; }
  .live.stale { color: var(--muted); border-color: var(--line); }
  .live.stale .dot, .live.stale .dot::after { background: var(--muted); animation: none; }
  @keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(3.2); opacity: 0; } }
  h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(40px, 7vw, 72px); line-height: 1.02; color: var(--blanco); margin: 56px 0 14px; }
  h1 em { color: var(--terracota); font-style: italic; }
  .sub { color: var(--muted); max-width: 560px; }
  .meta { margin-top: 10px; font-size: 12px; letter-spacing: .08em; color: var(--muted); }
  .progress { margin: 44px 0 0; }
  .bar { height: 2px; background: var(--line); position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--terracota); width: 0; transition: width 1.2s cubic-bezier(.16,1,.3,1); }
  .nums { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  .nums b { font-family: var(--serif); font-weight: 300; font-size: 34px; color: var(--blanco); letter-spacing: 0; margin-right: 6px; }
  .now { margin: 56px 0; padding: 28px; background: var(--verde); border-left: 2px solid var(--terracota); }
  .label { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--tumbaga); }
  .now h2 { font-family: var(--serif); font-weight: 300; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; color: var(--blanco); margin: 10px 0 8px; }
  .now p { color: var(--muted); max-width: 640px; }
  section.group { margin-top: 48px; }
  section.group > .label { display: flex; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  ul { list-style: none; padding: 0; }
  li { display: grid; grid-template-columns: 90px 1fr auto; gap: 16px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .area { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--tumbaga); }
  .title { color: var(--blanco); }
  .task-id { display: inline-block; margin-right: 10px; color: var(--tumbaga); font-size: 11px; letter-spacing: .08em; }
  .note { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .state { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; color: var(--muted); }
  .state.done { color: var(--marfil); }
  .state.done::before { content: "✓ "; color: var(--terracota); }
  .state.in_progress { color: var(--terracota); }
  li.done .title { color: var(--marfil); }
  footer { margin-top: 72px; font-size: 12px; color: var(--muted); }
  .error { color: var(--terracota); margin-top: 24px; font-size: 13px; }
  @media (max-width: 560px) {
    li { grid-template-columns: 1fr auto; gap: 4px 12px; }
    .area { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot::after { animation: none; }
    .bar i { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">meridiana</div>
    <div class="live" id="live"><span class="dot"></span><span id="liveText">En vivo</span></div>
  </header>

  <h1>Estado del <em>sitio</em></h1>
  <p class="sub" id="milestone"></p>
  <p class="meta" id="updated"></p>

  <div class="progress">
    <div class="bar"><i id="barFill"></i></div>
    <div class="nums">
      <span><b id="doneCount">–</b>publicadas</span>
      <span><b id="totalCount">–</b>en total</span>
    </div>
  </div>

  <div class="now" id="nowBox" hidden>
    <div class="label" id="nowLabel">Trabajando ahora</div>
    <h2 id="nowTitle"></h2>
    <p id="nowDetail"></p>
  </div>

  <div id="groups"></div>
  <p class="error" id="error" hidden>No se pudo actualizar. Se reintentará automáticamente.</p>

  <footer>Esta página se actualiza sola cada minuto. Cada cambio se prueba antes de publicarse en el sitio.</footer>
</div>

<script>
(function () {
  "use strict";
  var REFRESH_MS = 60000;
  var GROUPS = [
    { key: "in_progress", label: "En curso", stateText: "En curso" },
    { key: "todo", label: "Siguientes", stateText: "Pendiente" },
    { key: "waiting", label: "Esperando material de Meridiana", stateText: "Esperando" },
    { key: "done", label: "Publicado", stateText: "Publicado" },
    { key: "later", label: "Más adelante", stateText: "Después" }
  ];

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function formatDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString("es-CO", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  function renderTask(task, group) {
    var li = el("li", task.status);
    li.appendChild(el("span", "area", task.area));
    var title = el("span", "title");
    title.appendChild(el("span", "task-id", task.id));
    title.appendChild(document.createTextNode(task.title));
    if (task.waitingFor) title.appendChild(el("span", "note", "Necesitamos: " + task.waitingFor));
    li.appendChild(title);
    var stateText = task.status === "done" && task.date ? task.date.split("-").reverse().join("/") : group.stateText;
    li.appendChild(el("span", "state " + task.status, stateText));
    return li;
  }

  function render(data) {
    var tasks = Array.isArray(data.tasks) ? data.tasks : [];
    var done = tasks.filter(function (t) { return t.status === "done"; }).length;

    document.getElementById("milestone").textContent = data.milestone || "";
    document.getElementById("updated").textContent = data.updatedAt ? "Última actualización: " + formatDate(data.updatedAt) : "";
    document.getElementById("doneCount").textContent = String(done);
    document.getElementById("totalCount").textContent = String(tasks.length);
    document.getElementById("barFill").style.width = tasks.length ? (done / tasks.length * 100) + "%" : "0";

    var nowBox = document.getElementById("nowBox");
    if (data.current && data.current.title) {
      var currentTask = tasks.find(function (task) { return task.id === data.current.id; });
      document.getElementById("nowLabel").textContent = (currentTask && currentTask.status === "in_progress"
        ? "Trabajando ahora"
        : "Próxima corrección") + " · " + data.current.id;
      document.getElementById("nowTitle").textContent = data.current.title;
      document.getElementById("nowDetail").textContent = data.current.detail || "";
      nowBox.hidden = false;
    } else {
      nowBox.hidden = true;
    }

    var container = document.getElementById("groups");
    container.replaceChildren();
    GROUPS.forEach(function (group) {
      var items = tasks.filter(function (t) { return t.status === group.key; });
      if (!items.length) return;
      if (group.key === "done") items = items.slice().reverse();
      var section = el("section", "group");
      var label = el("div", "label");
      label.appendChild(el("span", "", group.label));
      label.appendChild(el("span", "", String(items.length)));
      section.appendChild(label);
      var ul = el("ul");
      items.forEach(function (t) { ul.appendChild(renderTask(t, group)); });
      section.appendChild(ul);
      container.appendChild(section);
    });
  }

  function setLive(ok) {
    document.getElementById("live").classList.toggle("stale", !ok);
    document.getElementById("liveText").textContent = ok ? "En vivo" : "Reconectando";
    document.getElementById("error").hidden = ok;
  }

  function load() {
    fetch("/status.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) { render(data); setLive(true); })
      .catch(function () { setLive(false); });
  }

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
